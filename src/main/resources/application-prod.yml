spring:
  application:
    name: payment-system
  
  # 生产环境数据库配置
  datasource:
    url: jdbc:mysql://mysql-server:3306/payment_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: payment_user
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

server:
  port: 8080

# 生产环境日志配置
logging:
  level:
    root: WARN
    com.team.payment: INFO
    org.springframework: WARN

# 生产环境支付系统配置
payment:
  scheduler:
    enabled: false            # 生产环境由专司调度，不在应用内自启
    timeout-minutes: 15
    execution-interval-seconds: 60
    failure-rate: 0.1

