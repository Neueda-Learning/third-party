spring:
  application:
    name: payment-system
  
  # 数据库配置（通用，实际值由profile覆盖）
  datasource:
    url: jdbc:mysql://localhost:3306/payment_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: n3u3da!
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: validate

# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /

# 日志配置
logging:
  level:
    root: INFO
    com.team.payment: DEBUG
    org.springframework.web: DEBUG
    org.springframework.jdbc.core: DEBUG

# 支付系统配置
payment:
  scheduler:
    enabled: true              # 是否启用定时任务
    timeout-minutes: 15        # 超时时间（分钟）
    execution-interval-seconds: 60  # 执行间隔（秒）
    failure-rate: 0.1          # SENT超时时失败比例
  failure-ratio:
    create: 0              # 创建步骤失败比例
    validate: 0             # 校验步骤失败比例
    send: 0              # 发送步骤失败比例
    complete: 0              # 完成步骤失败比例
