<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支付处理系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- 顶部导航栏 -->
    <header class="navbar">
        <div class="navbar-inner">
            <div class="navbar-brand">
                <div class="brand-logo"><i class="fa-solid fa-credit-card"></i></div>
                <span class="brand-title">支付处理系统</span>
            </div>
            <nav class="navbar-nav">
                <a href="#" class="nav-item active" data-view="create">
                    <i class="fa-solid fa-plus"></i> 创建支付
                </a>
                <a href="#" class="nav-item" data-view="list">
                    <i class="fa-solid fa-list-ul"></i> 支付列表
                </a>
                <a href="#" class="nav-item" data-view="detail">
                    <i class="fa-solid fa-file-lines"></i> 支付详情
                </a>
            </nav>
            <div class="navbar-right">
                <span class="env-tag">DEV</span>
            </div>
        </div>
    </header>

    <!-- 内容区 -->
    <main class="page-main">

        <!-- 创建支付 -->
        <div id="view-create" class="view active">
            <div class="page-header">
                <h2>创建支付</h2>
            </div>
            <div class="card">
                <form id="createForm">
                    <div class="form-grid">
                        <div class="form-item">
                            <label for="sourceAccount">付款账户 <em>*</em></label>
                            <input type="text" id="sourceAccount" placeholder="e.g. ACC001" required>
                        </div>
                        <div class="form-item">
                            <label for="destinationAccount">收款账户 <em>*</em></label>
                            <input type="text" id="destinationAccount" placeholder="e.g. ACC002" required>
                        </div>
                        <div class="form-item">
                            <label for="amount">金额（CNY）<em>*</em></label>
                            <input type="number" id="amount" step="0.01" min="0.01" placeholder="0.00" required>
                        </div>
                        <div class="form-item">
                            <label for="reference">参考号 / 备注</label>
                            <input type="text" id="reference" placeholder="e.g. INV-2026001">
                        </div>
                        <div class="form-item">
                            <label for="idempotencyKey">幂等键</label>
                            <div class="input-adornment">
                                <input type="text" id="idempotencyKey" readonly>
                                <button type="button" id="regenKeyBtn" class="btn-adornment" title="重新生成">
                                    <i class="fa-solid fa-arrows-rotate"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">
                            <i class="fa-solid fa-paper-plane"></i> 提交
                        </button>
                        <button type="reset" class="btn btn-default">重置</button>
                    </div>
                </form>
                <div id="createFeedback" style="display:none"></div>
            </div>
        </div>

        <!-- 支付列表 -->
        <div id="view-list" class="view">
            <div class="page-header">
                <h2>支付列表</h2>
            </div>
            <div class="card">
                <div class="toolbar">
                    <div class="toolbar-filters">
                        <select id="statusFilter">
                            <option value="">全部状态</option>
                            <option value="CREATED">已创建</option>
                            <option value="VALIDATED">已验证</option>
                            <option value="SENT">已发送</option>
                            <option value="COMPLETED">已完成</option>
                            <option value="FAILED">失败</option>
                        </select>
                        <select id="pageSize">
                            <option value="10">10 条/页</option>
                            <option value="20" selected>20 条/页</option>
                            <option value="50">50 条/页</option>
                        </select>
                        <button id="queryBtn" class="btn btn-primary">
                            <i class="fa-solid fa-magnifying-glass"></i> 查询
                        </button>
                    </div>
                    <span id="totalCount" class="total-count"></span>
                </div>
                <div class="table-wrap">
                    <table id="paymentTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>幂等键</th>
                                <th>付款账户</th>
                                <th>收款账户</th>
                                <th>金额 (CNY)</th>
                                <th>状态</th>
                                <th>创建时间</th>
                                <th style="width:80px">操作</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr>
                                <td colspan="8" class="table-placeholder">
                                    <span class="spinner"></span> 加载中...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div id="pagination" class="pagination"></div>
            </div>
        </div>

        <!-- 支付详情 -->
        <div id="view-detail" class="view">
            <div class="page-header">
                <h2>支付详情</h2>
            </div>
            <div class="card">
                <div class="detail-search-bar">
                    <label for="detailId" class="sr-only">支付 ID</label>
                    <input type="number" id="detailId" placeholder="输入支付 ID" min="1">
                    <button id="detailQueryBtn" class="btn btn-primary">
                        <i class="fa-solid fa-magnifying-glass"></i> 查询
                    </button>
                </div>
                <div id="detailBody"></div>
            </div>
        </div>

    </main>

    <footer class="page-footer">
        <i class="fa-solid fa-shield-halved"></i>
        &copy; 2026 Payment Processing System
    </footer>

    <script src="/js/api.js"></script>
    <script src="/js/main.js"></script>
</body>
</html>
