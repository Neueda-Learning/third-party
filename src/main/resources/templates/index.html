<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支付处理系统</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="app-shell">
    <header class="hero">
        <div class="hero__left">
            <p class="hero__eyebrow">Payment Control Center</p>
            <h1><span aria-hidden="true">&#128179;</span> <span data-i18n="app.title">支付处理系统</span></h1>
        </div>
        <div class="hero__right">
            <button class="btn btn--ghost hero__lang" id="languageToggleBtn" type="button">English</button>
            <div class="hero__user" aria-label="current-user">
                <span class="hero__user-icon" aria-hidden="true">&#128100;</span>
                <span class="hero__user-text" data-i18n="hero.loggedIn">已登录用户</span>
            </div>
        </div>
    </header>

    <div class="workspace">
        <aside class="sidebar" aria-label="导航">
            <button class="tab-btn is-active" data-tab="create" type="button" data-i18n="tab.create">创建支付</button>
            <button class="tab-btn" data-tab="list" type="button" data-i18n="tab.list">支付列表</button>
            <button class="tab-btn" data-tab="detail" type="button" data-i18n="tab.detail">支付详情</button>
            <button class="tab-btn" data-tab="account" type="button" data-i18n="tab.account">账户管理</button>
            <button class="tab-btn tab-btn--quiet" id="quickRefreshBtn" type="button" data-i18n="tab.refresh">刷新当前列表</button>
        </aside>

        <main class="content" aria-live="polite">
            <section id="create" class="panel is-active" data-panel>
                <div class="panel__head">
                    <h2 data-i18n="create.title">创建支付</h2>
                </div>

                <form id="createForm" class="form-grid" novalidate>
                    <label class="field">
                        <span data-i18n="field.source">付款账户</span>
                        <div class="input-badge-wrap">
                            <input id="sourceAccount" name="sourceAccount" type="text" placeholder="例如 ACC001" data-i18n-placeholder="ph.source" maxlength="50" required>
                            <span class="currency-badge" id="sourceCurrencyBadge" hidden></span>
                        </div>
                    </label>
                    <label class="field">
                        <span data-i18n="field.destination">收款账户</span>
                        <div class="input-badge-wrap">
                            <input id="destinationAccount" name="destinationAccount" type="text" placeholder="例如 ACC002" data-i18n-placeholder="ph.destination" maxlength="50" required>
                            <span class="currency-badge" id="destinationCurrencyBadge" hidden></span>
                        </div>
                    </label>
                    <label class="field">
                        <span data-i18n="field.amount">金额</span>
                        <input id="amount" name="amount" type="number" step="0.01" min="0.01" placeholder="1500.50" data-i18n-placeholder="ph.amount" required>
                    </label>
                    <label class="field">
                        <span data-i18n="field.reference">参考号 / 备注</span>
                        <input id="reference" name="reference" type="text" placeholder="例如 INV-20260727" data-i18n-placeholder="ph.reference" maxlength="255">
                    </label>
                    <label class="field">
                        <span data-i18n="field.exchangeRate">汇率（跨币种时必填）</span>
                        <input id="exchangeRate" name="exchangeRate" type="number" step="0.000001" min="0.000001" placeholder="例如 7.25" data-i18n-placeholder="ph.exchangeRate">
                    </label>
                    <div class="field field--full">
                        <label for="idempotencyKey"><span data-i18n="field.idempotency">幂等键</span></label>
                        <div class="inline-input">
                            <input id="idempotencyKey" name="idempotencyKey" type="text" readonly>
                            <button id="generateKeyBtn" class="btn btn--ghost" type="button" data-i18n="btn.regenerate">重新生成</button>
                        </div>
                    </div>

                    <div class="actions field--full">
                        <button class="btn btn--primary" id="submitCreateBtn" type="submit" data-i18n="btn.create">创建支付</button>
                        <button class="btn btn--secondary" id="fillDemoBtn" type="button" data-i18n="btn.fillDemo">填充示例</button>
                        <button class="btn btn--ghost" type="reset" data-i18n="btn.reset">重置</button>
                    </div>
                    <p id="createFormHint" class="hint field--full" data-i18n="hint.default">金额必须大于 0，且付款账户和收款账户不能相同。</p>
                </form>

                <div id="createResult" class="feedback"></div>
            </section>

            <section id="list" class="panel" data-panel>
                <div class="panel__head">
                    <h2 data-i18n="list.title">支付列表</h2>
                </div>

                <div class="toolbar">
                    <label>
                        <span data-i18n="list.status">状态</span>
                        <select id="statusFilter">
                            <option value="" data-i18n="status.all">全部</option>
                            <option value="CREATED">CREATED</option>
                            <option value="VALIDATED">VALIDATED</option>
                            <option value="SENT">SENT</option>
                            <option value="COMPLETED">COMPLETED</option>
                            <option value="FAILED">FAILED</option>
                        </select>
                    </label>
                    <label>
                        <span data-i18n="list.pageSize">每页</span>
                        <select id="pageSize">
                            <option value="10">10</option>
                            <option value="20" selected>20</option>
                            <option value="50">50</option>
                        </select>
                    </label>
                    <button class="btn btn--primary" id="queryBtn" type="button" data-i18n="btn.query">查询</button>
                </div>

                <div class="table-wrap" id="listRegion">
                    <table id="paymentTable">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th data-i18n="col.source">付款方</th>
                            <th data-i18n="col.destination">收款方</th>
                            <th data-i18n="col.amount">金额</th>
                            <th data-i18n="col.status">状态</th>
                            <th data-i18n="col.createdAt">创建时间</th>
                            <th data-i18n="col.action">操作</th>
                        </tr>
                        </thead>
                        <tbody id="paymentTableBody">
                        <tr>
                            <td colspan="7" class="empty" data-i18n="list.initial">点击“查询”加载数据</td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div id="pagination" class="pagination"></div>
            </section>

            <section id="detail" class="panel" data-panel>
                <div class="panel__head">
                    <h2 data-i18n="detail.title">支付详情</h2>
                </div>

                <div class="detail-query">
                    <label for="detailPaymentId" class="sr-only" data-i18n="detail.idLabel">支付ID</label>
                    <input type="number" id="detailPaymentId" min="1" placeholder="输入支付ID，例如 1" data-i18n-placeholder="ph.detailId">
                    <button id="detailQueryBtn" class="btn btn--primary" type="button" data-i18n="btn.queryDetail">查询详情</button>
                </div>

                <div id="detailContent" class="detail-grid detail-grid--empty" data-empty-text>尚未查询任何支付记录</div>

                <section class="status-flow-card" id="statusFlowSection" hidden>
                    <h3 data-i18n="detail.flow">状态流程</h3>
                    <div id="statusFlow" class="status-flow"></div>
                </section>

                <section id="historySection" class="history" hidden>
                    <h3 data-i18n="detail.history">状态变更历史</h3>
                    <div id="historyTimeline"></div>
                </section>
            </section>

            <!-- ══════════════ 账户管理 ══════════════ -->
            <section id="account" class="panel" data-panel>
                <div class="panel__head">
                    <h2 data-i18n="account.title">账户管理</h2>
                    <p data-i18n="account.desc">创建账户、查询账户信息、为账户充值。</p>
                </div>

                <!-- 子导航 Tab 栏 -->
                <nav class="sub-tabs" aria-label="account-subtabs">
                    <button class="sub-tab-btn is-active" data-subtab="acc-create" type="button" data-i18n="account.create.title">创建账户</button>
                    <button class="sub-tab-btn" data-subtab="acc-query" type="button" data-i18n="account.query.title">查询账户</button>
                    <button class="sub-tab-btn" data-subtab="acc-deposit" type="button" data-i18n="account.deposit.title">账户充值</button>
                </nav>

                <!-- 创建账户 -->
                <div class="sub-card" id="acc-create-panel" data-subpanel>
                    <form id="createAccountForm" class="form-grid" novalidate>
                        <label class="field">
                            <span data-i18n="account.field.accountName">账户名</span>
                            <input id="accAccountName" name="accountName" type="text" placeholder="例如 alice" data-i18n-placeholder="ph.accAccountName" maxlength="64" required>
                        </label>
                        <label class="field">
                            <span data-i18n="account.field.currency">币种</span>
                            <select id="accCurrency" name="currency" required>
                                <option value="CNY" selected>CNY</option>
                                <option value="USD">USD</option>
                                <option value="EUR">EUR</option>
                            </select>
                        </label>
                        <label class="field field--full">
                            <span data-i18n="account.field.initialBalance">初始余额</span>
                            <input id="accInitialBalance" name="initialBalance" type="number" step="0.01" min="0" placeholder="0.00" data-i18n-placeholder="ph.accInitialBalance" required>
                        </label>
                        <div class="actions field--full">
                            <button class="btn btn--primary" id="submitCreateAccountBtn" type="submit" data-i18n="account.btn.create">创建账户</button>
                            <button class="btn btn--ghost" type="reset" data-i18n="btn.reset">重置</button>
                        </div>
                    </form>
                    <div id="createAccountResult" class="feedback"></div>
                </div>

                <!-- 查询账户 -->
                <div class="sub-card" id="acc-query-panel" data-subpanel style="display:none">
                    <p style="margin-bottom:0.75rem;color:#666;font-size:0.875rem" data-i18n="account.query.desc">填写 ID 或账户名查询单个账户，两者均不填则查询全部。</p>
                    <form id="queryAccountForm" class="form-grid" novalidate>
                        <label class="field">
                            <span data-i18n="account.query.byId">账户 ID</span>
                            <input type="number" id="queryAccountId" name="accountId" min="1" placeholder="输入账户 ID" data-i18n-placeholder="ph.accId">
                        </label>
                        <label class="field">
                            <span data-i18n="account.query.byAccountName">账户名</span>
                            <input type="text" id="queryAccountAccountName" name="accountName" placeholder="输入账户名" data-i18n-placeholder="ph.accAccountName" maxlength="64">
                        </label>
                        <div class="actions field--full">
                            <button class="btn btn--primary" id="queryAccountBtn" type="submit" data-i18n="account.btn.query">查询</button>
                            <button class="btn btn--ghost" id="resetQueryAccountBtn" type="reset" data-i18n="btn.reset">重置</button>
                        </div>
                    </form>
                    <div id="accountListContent" style="margin-top:1rem;display:none;"></div>
                    <div id="accountDetailContent" class="detail-grid detail-grid--empty" style="margin-top:1rem" data-empty-text>尚未查询任何账户</div>
                </div>

                <!-- 充值 -->
                <div class="sub-card" id="acc-deposit-panel" data-subpanel style="display:none">
                    <form id="depositForm" class="form-grid" novalidate>
                        <label class="field">
                            <span data-i18n="account.field.accountId">账户 ID</span>
                            <input id="depositAccountId" name="accountId" type="number" min="1" placeholder="输入账户 ID" data-i18n-placeholder="ph.accId" required>
                        </label>
                        <label class="field">
                            <span data-i18n="account.field.depositAmount">充值金额</span>
                            <input id="depositAmount" name="amount" type="number" step="0.01" min="0.01" placeholder="100.00" data-i18n-placeholder="ph.amount" required>
                        </label>
                        <div class="actions field--full">
                            <button class="btn btn--primary" id="submitDepositBtn" type="submit" data-i18n="account.btn.deposit">确认充值</button>
                            <button class="btn btn--ghost" type="reset" data-i18n="btn.reset">重置</button>
                        </div>
                    </form>
                    <div id="depositResult" class="feedback"></div>
                </div>
            </section>
        </main>
    </div>

    <footer class="footer" data-i18n="footer">Thrid-Party | 2026</footer>
</div>

<div id="toastContainer" class="toast-container" aria-live="assertive"></div>

<script src="/js/api.js"></script>
<script src="/js/main.js"></script>
</body>
</html>
