<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支付处理系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-brand">
                <div class="brand-icon"><i class="fa-solid fa-credit-card"></i></div>
                <div class="brand-text">
                    <h1>支付处理系统</h1>
                    <p class="brand-sub">Payment Processing System</p>
                </div>
            </div>
            <nav>
                <ul>
                    <li>
                        <a href="#create" class="nav-link active">
                            <i class="fa-solid fa-plus-circle"></i>
                            <span>创建支付</span>
                        </a>
                    </li>
                    <li>
                        <a href="#list" class="nav-link">
                            <i class="fa-solid fa-list"></i>
                            <span>支付列表</span>
                        </a>
                    </li>
                    <li>
                        <a href="#detail" class="nav-link">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <span>支付详情</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </header>

        <main>
            <!-- 创建支付模块 -->
            <section id="create" class="module create-module">
                <h2><i class="fa-solid fa-file-invoice-dollar"></i> 创建支付</h2>
                <form id="createForm" class="form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="sourceAccount">
                                <i class="fa-solid fa-arrow-up-from-bracket"></i>
                                付款账户 <span class="required">*</span>
                            </label>
                            <input type="text" id="sourceAccount" name="sourceAccount"
                                   placeholder="e.g., ACC001" required>
                        </div>
                        <div class="form-group">
                            <label for="destinationAccount">
                                <i class="fa-solid fa-arrow-down-to-bracket"></i>
                                收款账户 <span class="required">*</span>
                            </label>
                            <input type="text" id="destinationAccount" name="destinationAccount"
                                   placeholder="e.g., ACC002" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="amount">
                                <i class="fa-solid fa-yen-sign"></i>
                                金额（CNY）<span class="required">*</span>
                            </label>
                            <input type="number" id="amount" name="amount" step="0.01"
                                   placeholder="1500.50" required>
                        </div>
                        <div class="form-group">
                            <label for="reference">
                                <i class="fa-solid fa-hashtag"></i>
                                参考号 / 备注
                            </label>
                            <input type="text" id="reference" name="reference"
                                   placeholder="e.g., INV-20260729">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="idempotencyKey">
                            <i class="fa-solid fa-key"></i>
                            幂等键（系统生成）
                        </label>
                        <input type="text" id="idempotencyKey" readonly class="readonly-input">
                    </div>

                    <div class="button-group">
                        <button type="button" id="generateKeyBtn" class="btn btn-secondary">
                            <i class="fa-solid fa-rotate"></i> 生成幂等键
                        </button>
                        <button type="submit" class="btn btn-primary">
                            <i class="fa-solid fa-paper-plane"></i> 提交
                        </button>
                        <button type="reset" class="btn btn-outline">
                            <i class="fa-solid fa-eraser"></i> 重置
                        </button>
                    </div>
                </form>

                <div id="createResult" class="result"></div>
            </section>

            <!-- 支付列表模块 -->
            <section id="list" class="module list-module">
                <h2><i class="fa-solid fa-table-list"></i> 支付列表</h2>
                <div class="filters">
                    <div class="filter-group">
                        <label for="statusFilter"><i class="fa-solid fa-filter"></i> 状态筛选：</label>
                        <select id="statusFilter">
                            <option value="">全部</option>
                            <option value="CREATED">已创建</option>
                            <option value="VALIDATED">已验证</option>
                            <option value="SENT">已发送</option>
                            <option value="COMPLETED">已完成</option>
                            <option value="FAILED">失败</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="pageSize"><i class="fa-solid fa-layer-group"></i> 分页：</label>
                        <select id="pageSize">
                            <option value="10">10条/页</option>
                            <option value="20" selected>20条/页</option>
                            <option value="50">50条/页</option>
                        </select>
                    </div>
                    <button id="queryBtn" class="btn btn-primary">
                        <i class="fa-solid fa-search"></i> 查询
                    </button>
                </div>

                <div class="table-wrapper">
                    <table id="paymentTable" class="table">
                        <thead>
                            <tr>
                                <th><i class="fa-solid fa-fingerprint"></i> ID</th>
                                <th><i class="fa-solid fa-key"></i> 幂等键</th>
                                <th><i class="fa-solid fa-circle-arrow-up"></i> 付款账户</th>
                                <th><i class="fa-solid fa-circle-arrow-down"></i> 收款账户</th>
                                <th><i class="fa-solid fa-yen-sign"></i> 金额(CNY)</th>
                                <th><i class="fa-solid fa-circle-half-stroke"></i> 状态</th>
                                <th><i class="fa-regular fa-clock"></i> 创建时间</th>
                                <th><i class="fa-solid fa-gears"></i> 操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr class="loading">
                                <td colspan="8">
                                    <span class="loading-spinner"></span> 加载中...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div id="pagination" class="pagination"></div>
            </section>

            <!-- 支付详情模块 -->
            <section id="detail" class="module detail-module">
                <h2><i class="fa-solid fa-receipt"></i> 支付详情</h2>
                <div class="detail-search">
                    <div class="search-input-wrap">
                        <i class="fa-solid fa-magnifying-glass search-icon"></i>
                        <input type="number" id="detailPaymentId" placeholder="输入支付ID" min="1">
                    </div>
                    <button id="detailQueryBtn" class="btn btn-primary">
                        <i class="fa-solid fa-search"></i> 查询
                    </button>
                </div>

                <div id="detailContent" class="detail-content"></div>

                <div id="historySection" class="history-section" style="display:none;">
                    <h3><i class="fa-solid fa-timeline"></i> 状态变更历史</h3>
                    <div id="historyTimeline" class="timeline"></div>
                </div>

                <div id="operationsSection" class="operations-section" style="display:none;">
                    <h3><i class="fa-solid fa-sliders"></i> 手动操作（演示用）</h3>
                    <div id="operationButtons" class="button-group"></div>
                </div>
            </section>
        </main>

        <footer>
            <i class="fa-solid fa-shield-halved"></i>
            &copy; 2026 支付处理系统 &nbsp;|&nbsp;
        </footer>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/main.js"></script>
</body>
</html>
